name: Windows compatibility and security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 - audit, tests and installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integrations/vscode/package-lock.json

      - name: Set up Rust (Windows MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm ci --prefix integrations/vscode

      - name: Audit JavaScript dependencies
        run: npm run audit:security

      - name: Test Windows dependency graph
        run: |
          node --test scripts/windows-rust-dependency-graph.test.mjs
          node scripts/check-windows-rust-deps.mjs

      - name: Validate TypeScript, formatting and ESLint
        run: npm run validate

      - name: Run full test suite on Windows
        run: npm test

      - name: Build Windows NSIS installer
        run: npm run build
